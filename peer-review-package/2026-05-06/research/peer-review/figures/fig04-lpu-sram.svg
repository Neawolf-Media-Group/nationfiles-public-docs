<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img">
  <title>LPU: on-chip SRAM vs external memory</title>
  <rect width="720" height="240" fill="#f8fafc"/>
  <text x="360" y="26" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700" fill="#1a365d">Inference: memory locality (conceptual)</text>
  <rect x="40" y="50" width="300" height="160" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
  <text x="190" y="78" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="11" font-weight="600" fill="#64748b">Classical separation</text>
  <text x="60" y="115" font-family="DejaVu Sans,sans-serif" font-size="10" fill="#374151">Compute &lt;-&gt; DRAM/HBM</text>
  <text x="60" y="135" font-family="DejaVu Sans,sans-serif" font-size="9" fill="#6b7280">autoregressive steps wait on bus</text>
  <rect x="380" y="50" width="300" height="160" rx="8" fill="#fff" stroke="#1a365d" stroke-width="2.5"/>
  <text x="530" y="78" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="11" font-weight="600" fill="#1a365d">LPU-style colocation</text>
  <text x="400" y="110" font-family="DejaVu Sans,sans-serif" font-size="10" fill="#374151">Weights resident in on-chip SRAM;</text>
  <text x="400" y="128" font-family="DejaVu Sans,sans-serif" font-size="10" fill="#374151">streaming tensors; deterministic schedule.</text>
  <text x="530" y="180" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="9" fill="#6b7280">Knowledge Graph: LPU = architecture entity</text>
</svg>
