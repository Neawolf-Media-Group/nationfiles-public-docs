<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img">
  <title>Paradigm: static stock vs operational situational picture</title>
  <rect width="720" height="220" fill="#f8fafc"/>
  <text x="360" y="28" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700" fill="#1a365d">From static reading stock to continuously advanced situational picture</text>
  <rect x="40" y="60" width="200" height="100" rx="6" fill="#fff" stroke="#1a365d" stroke-width="2"/>
  <text x="140" y="108" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="11" fill="#374151">Periodic / archival snapshot</text>
  <text x="140" y="142" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="10" fill="#6b7280">low refresh coupling</text>
  <path d="M270 110 L330 110" stroke="#1a365d" stroke-width="3" fill="none" marker-end="url(#m)"/>
  <defs><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1a365d"/></marker></defs>
  <rect x="360" y="50" width="320" height="120" rx="6" fill="#fff" stroke="#1a365d" stroke-width="2"/>
  <text x="520" y="78" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="11" font-weight="600" fill="#1a365d">Operational loop</text>
  <text x="400" y="102" font-family="DejaVu Sans,sans-serif" font-size="10" fill="#374151">connectors -&gt; materialisation -&gt;</text>
  <text x="400" y="118" font-family="DejaVu Sans,sans-serif" font-size="10" fill="#374151">Naciro / NFSI layers -&gt;</text>
  <text x="400" y="134" font-family="DejaVu Sans,sans-serif" font-size="10" fill="#374151">controllers and exports</text>
  <text x="520" y="160" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="9" fill="#6b7280">single relational truth, plural ontologies</text>
</svg>
